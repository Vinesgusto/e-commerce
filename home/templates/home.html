{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Loja - Produtos</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f8f9fa;
            padding: 20px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .card {
            background: white;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            text-align: center;
        }

        .card img {
            max-width: 100%;
            height: auto;
        }

        .card h3 {
            margin-top: 10px;
            font-size: 18px;
        }

        .card p {
            color: #555;
        }

        .btn {
            margin-top: 10px;
            background: #007bff;
            color: white;
            padding: 8px 12px;
            border: none;
            border-radius: 5px;
            text-decoration: none;
            display: inline-block;
        }
    </style>
</head>
<body>
    <h1>Produtos</h1>
    <div class="grid">
        {% for produto in produtos %}
        <div class="card">
            <img src="{{ produto.imagem.url }}" alt="{{ produto.nome }}">
            <h3>{{ produto.nome }}</h3>
            <p>R$ {{ produto.preco|floatformat:2 }}</p>
            <a href="{% url 'produto_detail' produto.id %}" class="btn">Ver produto</a>
        </div>
        {% endfor %}
    </div>
</body>
</html>
