{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Meu Perfil</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f3f6fb;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        .profile-container {
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        .profile-pic {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #3498db;
            margin-bottom: 15px;
        }
        h2 {
            margin: 10px 0;
            color: #2c3e50;
        }
        p {
            color: #34495e;
            margin: 5px 0;
        }
        .btn {
            display: inline-block;
            margin-top: 20px;
            background: #b02a37;
            color: #fff;
            padding: 12px 18px;
            border-radius: 8px;
            text-decoration: none;
            transition: 0.3s;
        }
        .btn:hover {
            background: #b02a37;
        }
        .btn2 {
            display: inline-block;
            margin-top: 20px;
            background: #3498db;
            color: #fff;
            padding: 12px 18px;
            border-radius: 8px;
            text-decoration: none;
            transition: 0.3s;
        }
        .btn2:hover {
            background: #2980b9;
        }
    </style>
</head>
<body>
    
    <div class="profile-container">
        <!-- Foto do usuário -->
        {% if user.profile and user.profile.foto %}
        <img src="{{ user.profile.foto.url }}" alt="Foto de perfil" class="profile-pic">
        {% else %}
        <img src="{% static 'img/default-user.png' %}" alt="Foto de perfil" class="profile-pic">
        {% endif %}
        
        <!-- Nome e email -->
        <h2>{{ user.username }}</h2>
        <p>{{ user.email }}</p>
        
        <!-- Botão de logout -->
        <a href="{% url 'logout' %}" class="btn">Sair</a>
        <a href="{% url 'home' %}" class="btn2">Loja</a>
    </div>
</body>
</html>
